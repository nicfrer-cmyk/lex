; ============================================================================
; ARI — ממשק ה-REST/WebSocket שדרכו ה-Orchestrator שולט בשיחות
; ============================================================================
;
; ⚠ הסיסמה **אינה** כאן. ה-entrypoint מרנדר את הקובץ מהתבנית עם
; ARI_PASSWORD מ-.env. קובץ עם סיסמה אמיתית לא נכנס ל-git.
; ============================================================================

[general]
enabled = yes
; pretty=no — הפלט נצרך ע"י קוד, לא ע"י אדם. רווחים מיותרים הם bandwidth
; על כל אירוע של כל שיחה.
pretty = no
; אירועי ערוץ מפורטים. ה-Orchestrator צריך לדעת מתי המדיה נפתחה, לא רק
; מתי השיחה התחילה.
allowed_origins = *

[${ARI_USERNAME}]
type = user
read_only = no
password = ${ARI_PASSWORD}
; plain ולא crypt: הסיסמה מוזרקת מ-.env בזמן רינדור, ומעולם לא נשמרת.
; crypt היה מחייב לשמור hash בקובץ שנשמר בגרסאות.
password_format = plain
