; ============================================================================
; שרת ה-HTTP הפנימי של Asterisk — הבסיס ל-ARI
; ============================================================================
;
; ⚠ bindaddr = 127.0.0.1 ולא 0.0.0.0, וזו לא החמרה מיותרת: ARI חושף
; שליטה מלאה בשיחות — לענות, לנתק, לגשר, להזרים מדיה. חשיפה שלו לרשת
; פירושה שמי שמגיע לפורט 8088 יכול להאזין לשיחות של משרד עורכי דין.
;
; ה-Orchestrator רץ באותו network_mode: host, ולכן 127.0.0.1 מספיק לו.
; מי שמפריד אותם למכונות שונות חייב TLS + firewall, לא bindaddr פתוח.
; ============================================================================

[general]
enabled = yes
bindaddr = 127.0.0.1
bindport = 8088
; נדרש ל-ARI events — ARI מבוסס על WebSocket מעל שרת ה-HTTP הזה.
enablestatic = no
; חשיפת גרסה מדויקת ב-Server header מקצרת לתוקף את הדרך לפגיעות ידועה.
servername = voice-gateway

; TLS מכובה כי החיבור הוא loopback בלבד. להפעלה בפריסה מפוצלת:
;   tlsenable = yes
;   tlsbindaddr = 0.0.0.0:8089
;   tlscertfile = /etc/asterisk/keys/asterisk.pem
tlsenable = no
