; ============================================================================
; Dialplan — מינימלי בכוונה
; ============================================================================
;
; ⚠ כל ההיגיון של השיחה חי ב-Orchestrator וב-CRM, לא כאן. dialplan הוא
; שפה שקשה לבדוק, קשה לנפות ואי אפשר לכתוב לה בדיקות יחידה — ולכן הוא
; עושה דבר אחד: לענות, ולמסור את השיחה ל-Stasis. משם ARI שולט.
;
; מה ש-Asterisk כן אחראי עליו: לענות, לגשר, להעביר מדיה, לנתק, להחזיק.
; מה שהוא לא: מי המתקשר, מה נאמר, ומה לעשות בזה.
; ============================================================================

[globals]
PUBLIC_OFFICE_PHONE = ${ENV(PUBLIC_OFFICE_PHONE)}
VOICE_APP = ${ENV(ARI_APP_NAME)}


; ---------------------------------------------------------------------------
; שיחות נכנסות
; ---------------------------------------------------------------------------
[lextrack-inbound]

; _X. = כל מספר. הקו מקבל שיחות למספר אחד בשלב זה, ואין טעם לפרט
; תוסחות לפני שיש יותר מקו אחד.
exten => _X.,1,NoOp(שיחה נכנסת מ-${CALLERID(num)} אל ${EXTEN})
 ; ⚠ Answer לפני Stasis, ולא אחריו. ערוץ שלא נענה אינו יכול לשאת מדיה,
 ; וה-Orchestrator היה מקבל אירוע StasisStart ומגלה שאין מה להקליט.
 same => n,Answer()
 ; שנייה של המתנה: פותחת את נתיב האודיו לפני שהסוכן מדבר. בלעדיה
 ; המילים הראשונות נבלעות — תקלה שנשמעת כמו "המערכת לא עונה".
 same => n,Wait(1)
 ; מכאן ואילך ARI שולט. שני הארגומנטים נמסרים ל-Orchestrator כדי שיוכל
 ; לזהות את השיחה בלי לשאול את Asterisk בחזרה.
 same => n,Stasis(${VOICE_APP},inbound,${CALLERID(num)},${EXTEN})
 ; ⚠ נקודת הנפילה. אם ה-Orchestrator לא רץ, Stasis חוזר מיד. בלי
 ; ההמשך כאן המתקשר היה שומע ניתוק שקט — הדבר הגרוע ביותר שמשרד יכול
 ; לעשות לפונה. במקום זה: הודעה, ואז ניתוק מסודר. השיחה נרשמת ב-CDR,
 ; ובעל המשרד רואה שהתקשרו.
 same => n,NoOp(⚠ Stasis חזר — שרת הקול אינו זמין)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; העברה לנציג אנושי
; ---------------------------------------------------------------------------
[lextrack-transfer]

; ⚠⚠ ההגנה החשובה ביותר בקובץ.
;
; אם HUMAN_TRANSFER_NUMBER זהה למספר הציבורי, והשיחה הופנתה מהמספר
; הציבורי אל ה-AI מלכתחילה — ההעברה מחזירה את השיחה לעצמה. התוצאה היא
; לולאת Call Forwarding: ערוצים שנפתחים עד שהמערכת או הספק קורסים,
; וחיוב על כל אחד מהם.
;
; הבדיקה כאן היא שכבה שנייה. הראשונה היא ב-CRM (הכלי transfer_call מסומן
; available=false), אבל dialplan שאפשר להגיע אליו בדרך אחרת חייב להגן על
; עצמו. אין הגנה יחידה על פעולה שגורמת נזק מצטבר.
exten => _X.,1,NoOp(בקשת העברה אל ${EXTEN})
 same => n,GotoIf($["${EXTEN}" = "${PUBLIC_OFFICE_PHONE}"]?loop)
 same => n,GotoIf($["${EXTEN}" = ""]?notarget)
 same => n,Dial(PJSIP/${EXTEN}@trunk,30)
 same => n,Hangup()

 same => n(loop),NoOp(⛔ ההעברה בוטלה — היעד זהה למספר הציבורי, לולאת ניתוב)
 same => n,Hangup()

 same => n(notarget),NoOp(⛔ לא הוגדר יעד העברה)
 same => n,Hangup()


; ---------------------------------------------------------------------------
; שיחות יוצאות — שמור לעתיד
; ---------------------------------------------------------------------------
; אין חיוג יוצא אוטומטי בשלב זה. מערכת שמתקשרת ביוזמתה ללקוחות של משרד
; עורכי דין דורשת החלטה מפורשת של בעל המשרד, לא ברירת מחדל של תשתית.
[lextrack-outbound]
exten => _X.,1,NoOp(חיוג יוצא אינו מופעל)
 same => n,Hangup()
